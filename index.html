<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iBots Smart Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #001F54, #0078ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo-container {
      margin-top: 20px;
      text-align: center;
    }
    .logo-container img {
      width: 280px;
      max-width: 90%;
    }
    .title {
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .subtitle {
      color: #a0d8ff;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .dashboard {
      width: 90%;
      max-width: 1200px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      animation: fadeIn 1s ease-in-out;
      overflow-y: auto;
    }
    .card {
      background: linear-gradient(145deg, #e6f0ff, #ffffff);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .card.on {
      box-shadow: 0 0 20px 5px #00c6ff;
    }
    .icon {
      font-size: 50px;
      margin-bottom: 10px;
      color: #0078ff;
      animation: bounce 1.5s infinite;
    }
    .label {
      font-size: 18px;
      font-weight: bold;
      color: #001f54;
    }
    .toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 26px;
      background: #ccc;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .card.on .toggle {
      background: #00c6ff;
    }
    .card.on .toggle::before {
      transform: translateX(24px);
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .camera-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 400px;
      height: 300px;
      background: white;
      border: 5px solid #0078ff;
      border-radius: 15px;
      transform: translate(-50%, -50%);
      z-index: 1000;
      display: none;
    }
    .camera-popup iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
    }
    .close-btn {
      position: absolute;
      top: -15px;
      right: -15px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
  <script>
    function toggleAppliance(name) {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const label = card.querySelector('.label');
        if (label.innerText === name) {
          card.classList.toggle('on');
          if (name === 'Camera') {
            toggleCameraPopup();
          }
        }
      });
    }

    function toggleCameraPopup() {
      const popup = document.getElementById('cameraPopup');
      popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</head>
<body>
  <div class="logo-container">
    <img src="https://img.freepik.com/free-vector/smart-home-background-flat-style_23-2147865820.jpg?semt=ais_hybrid&w=740" alt="iBots Logo">
    <div class="title">iBots Smart Panel</div>
    <div class="subtitle">Unleash the Power of Smart Living</div>
  </div>
  <div class="dashboard">
    <div class="card" onclick="toggleAppliance('Light')">
      <div class="toggle"></div>
      <div class="icon">💡</div>
      <div class="label">Light</div>
    </div>
    <div class="card" onclick="toggleAppliance('Fan')">
      <div class="toggle"></div>
      <div class="icon">🌀</div>
      <div class="label">Fan</div>
    </div>
    <div class="card" onclick="toggleAppliance('TV')">
      <div class="toggle"></div>
      <div class="icon">📺</div>
      <div class="label">TV</div>
    </div>
    <div class="card" onclick="toggleAppliance('AC')">
      <div class="toggle"></div>
      <div class="icon">❄️</div>
      <div class="label">AC</div>
    </div>
    <div class="card" onclick="toggleAppliance('Heater')">
      <div class="toggle"></div>
      <div class="icon">🔥</div>
      <div class="label">Heater</div>
    </div>
    <div class="card" onclick="toggleAppliance('Lamp1')">
      <div class="toggle"></div>
      <div class="icon">💡</div>
      <div class="label">Lamp1</div>
    </div>
    <div class="card" onclick="toggleAppliance('Lamp2')">
      <div class="toggle"></div>
      <div class="icon">💡</div>
      <div class="label">Lamp2</div>
    </div>
    <div class="card" onclick="toggleAppliance('Lamp3')">
      <div class="toggle"></div>
      <div class="icon">💡</div>
      <div class="label">Lamp3</div>
    </div>
    <div class="card" onclick="toggleAppliance('Fan1')">
      <div class="toggle"></div>
      <div class="icon">🌀</div>
      <div class="label">Fan1</div>
    </div>
    <div class="card" onclick="toggleAppliance('Fan2')">
      <div class="toggle"></div>
      <div class="icon">🌀</div>
      <div class="label">Fan2</div>
    </div>
    <div class="card" onclick="toggleAppliance('Camera')">
      <div class="toggle"></div>
      <div class="icon">📷</div>
      <div class="label">Camera</div>
    </div>
  </div>

  <!-- Camera View Popup -->
  <div class="camera-popup" id="cameraPopup">
    <button class="close-btn" onclick="toggleCameraPopup()">×</button>
    <!-- Replace this with actual camera stream URL or video -->
    <iframe src="https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig" allowfullscreen></iframe>
  </div>
</body>
</html>
